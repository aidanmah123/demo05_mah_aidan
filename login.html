<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->
    <div class="p-5 mb-4 bg-light rounded-3">
      <div class="container-fluid py-5">
        <h1 class="display-1 fw-bold">Create a Memory Box</h1>
        <button
          onclick="window.location.href='index.html'"
          class="btn btn-primary btn-lg"
          type="button">
          Click me to go back to Home
        </button>
      </div>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4 px-4">
      
      <!-- Time Capsule 1 -->
      <div class="col">
        <div class="card h-100">
          <img src="./images/school.jpg" class="card-img-top" alt="School graduation">
          <div class="card-body">
            <h5 class="card-title">Time Capsule 1</h5>
            <p class="card-text">Just graduated school.</p>
          </div>
          <div class="card-footer">
            <small class="text-muted">Created 1 week ago</small>
          </div>
        </div>
      </div>

      <!-- Time Capsule 2 -->
      <div class="col">
        <div class="card h-100">
          <img src="./images/alamopano.png" class="card-img-top" alt="Alamo trip">
          <div class="card-body">
            <h5 class="card-title">Time Capsule 2</h5>
            <p class="card-text">My trip to Texas!</p>
          </div>
          <div class="card-footer">
            <small class="text-muted">Created 2 years ago</small>
          </div>
        </div>
      </div>

      <!-- Time Capsule 3 -->
      <div class="col">
        <div class="card h-100">
          <img src="./images/party.jpg" class="card-img-top" alt="Birthday party">
          <div class="card-body">
            <h5 class="card-title">Time Capsule 3</h5>
            <p class="card-text">My 18th Birthday!</p>
          </div>
          <div class="card-footer">
            <small class="text-muted">Created 8 Months ago</small>
          </div>
        </div>
      </div>

    </div> <!-- End of the single row -->

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
